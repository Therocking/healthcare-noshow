services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noshow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noshow}
      POSTGRES_DB: ${POSTGRES_DB:-noshow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noshow} -d ${POSTGRES_DB:-noshow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: healthcare-noshow
      ENVIRONMENT: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-noshow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noshow}
      POSTGRES_DB: ${POSTGRES_DB:-noshow}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ANALYSIS_DEFAULT_YEAR: ${ANALYSIS_DEFAULT_YEAR:-2024}
    ports:
      - "8000:8000"

volumes:
  pgdata:
