name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noshow
          POSTGRES_PASSWORD: noshow
          POSTGRES_DB: noshow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noshow -d noshow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://noshow:noshow@localhost:5432/noshow
      TEST_DATABASE_URL: postgresql+psycopg2://noshow:noshow@localhost:5432/noshow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
